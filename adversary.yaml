name: go/cli
version: 0.0.24
description: Reviews Go command-line applications for predictable configuration, cancellation, diagnostics, and exit behavior.

triggers:
  manual: true
  files_changed:
    - "cmd/**/*.go"
    - "**/cmd/**/*.go"
    - "cli/**/*.go"
    - "**/cli/**/*.go"
    - "**/main.go"

detection:
  files:
    - "cmd/**/*.go"
    - "**/cmd/**/*.go"
    - "cli/**/*.go"
    - "**/cli/**/*.go"
    - "**/main.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
